<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <defs>
    <filter id="fur" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.075" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="furSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.09" numOctaves="3" seed="10" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="bodyGrad" cx="42%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#F8ECD6"/>
      <stop offset="52%" stop-color="#F0DAB8"/>
      <stop offset="100%" stop-color="#D8BC92"/>
    </radialGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0DAB8"/>
      <stop offset="100%" stop-color="#D8BC92"/>
    </linearGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FAF0DE"/>
      <stop offset="100%" stop-color="#FAF0DE" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <!-- furry silhouette group: body + limbs + feet -->
  <g filter="url(#fur)">
    <!-- feet -->
    <ellipse cx="207" cy="438" rx="47" ry="26" fill="#D8BC92"/>
    <ellipse cx="305" cy="438" rx="47" ry="26" fill="#D8BC92"/>
    <!-- body -->
    <path d="M 256 92 C 318 92 362 138 380 208 C 398 268 406 322 394 366 C 376 420 322 438 256 438 C 190 438 136 420 118 366 C 106 322 114 268 132 208 C 150 138 194 92 256 92 Z" fill="url(#bodyGrad)"/>
    <!-- arms (on top of the body so the stubby arms stay visible) -->
    
      <ellipse cx="102" cy="318" rx="36" ry="58" transform="rotate(18 102 318)" fill="url(#armGrad)"/>
      <ellipse cx="410" cy="318" rx="36" ry="58" transform="rotate(-18 410 318)" fill="url(#armGrad)"/>
  </g>
  <!-- belly (smooth, no fur displacement) -->
  <ellipse cx="256" cy="348" rx="97" ry="84" fill="url(#bellyGrad)" filter="url(#furSoft)"/>
  <!-- fur strands on the head/sides -->
  <g filter="url(#furSoft)">
      <path d="M 196 104 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-30 196 104)" opacity="0.5"/>
      <path d="M 220 96 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-18 220 96)" opacity="0.5"/>
      <path d="M 244 92 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-6 244 92)" opacity="0.5"/>
      <path d="M 268 92 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(6 268 92)" opacity="0.5"/>
      <path d="M 292 97 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(18 292 97)" opacity="0.5"/>
      <path d="M 316 106 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(30 316 106)" opacity="0.5"/>
      <path d="M 152 142 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-50 152 142)" opacity="0.5"/>
      <path d="M 360 140 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(48 360 140)" opacity="0.5"/>
      <path d="M 132 196 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-66 132 196)" opacity="0.5"/>
      <path d="M 380 192 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(64 380 192)" opacity="0.5"/>
      <path d="M 118 258 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-82 118 258)" opacity="0.5"/>
      <path d="M 394 254 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(80 394 254)" opacity="0.5"/>
      <path d="M 116 314 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-95 116 314)" opacity="0.5"/>
      <path d="M 396 310 q 3 -8 9 -12" stroke="#D8BC92" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(92 396 310)" opacity="0.5"/>
  </g>
  <!-- face -->
  <path d="M 201 240 Q 214 226 227 240" stroke="#2A2320" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M 285 240 Q 298 226 311 240" stroke="#2A2320" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M 235 278 Q 256 293 277 278" stroke="#3A2E28" stroke-width="7" stroke-linecap="round" fill="none"/>
      <ellipse cx="182" cy="272" rx="17" ry="11" fill="#E8A088" opacity="0.35"/>
      <ellipse cx="330" cy="272" rx="17" ry="11" fill="#E8A088" opacity="0.35"/>
      <g fill="#F26D85" opacity="0.92">
        <path d="M 398 118 C 398 110 408 106 414 112 C 420 106 430 110 430 118 C 430 127 414 136 414 136 C 414 136 398 127 398 118 Z" transform="rotate(12 414 122)"/>
        <path d="M 436 158 C 436 152 443 149 448 153 C 453 149 460 152 460 158 C 460 165 448 172 448 172 C 448 172 436 165 436 158 Z" transform="rotate(-10 448 162)" opacity="0.8"/>
      </g>
</svg>