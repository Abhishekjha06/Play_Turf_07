# ============================================================
# PlayTurf — Production-Ready Nginx Configuration
# Features: HTTP/3 (QUIC), HTTP/2, TLS 1.3, Brotli, Gzip,
# Security Headers, Cache Control, Early Hints
# ============================================================

# Worker processes
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── Basic Settings ───────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    server_tokens off;

    # ── Performance ──────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ── File uploads ─────────────────────────────────────────
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ── Timeouts ─────────────────────────────────────────────
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ── Compression ──────────────────────────────────────────
    # Gzip (fallback)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Brotli (preferred)
    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── SSL / TLS ────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── OCSP ─────────────────────────────────────────────────
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Rate Limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── Logging format ───────────────────────────────────────
    log_format performance '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time" '
                           'protocol=$server_protocol quic=$http3';

    access_log /var/log/nginx/access.log performance;

    # ========================================================
    # Upstream: PlayTurf Vite App
    # ========================================================
    upstream playturf {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ========================================================
    # HTTP → HTTPS Redirect
    # ========================================================
    server {
        listen 80;
        listen [::]:80;
        server_name playturf.app www.playturf.app;

        location / {
            return 301 https://$host$request_uri;
        }

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # ========================================================
    # HTTPS Server (HTTP/2 + HTTP/3)
    # ========================================================
    server {
        listen 443 quic reuseport;
        listen 443 ssl;
        listen [::]:443 quic reuseport;
        listen [::]:443 ssl;

        http2 on;
        http3 on;
        quic_gso on;
        quic_retry on;

        server_name playturf.app www.playturf.app;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/playturf.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/playturf.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/playturf.app/chain.pem;

        # Early Hints (103)
        add_header Early-Hints "on" always;

        # ── Security Headers ─────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), encrypted-media=(), fullscreen=(self), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), speaker=(), sync-xhr=(), usb=(), vr=()" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googletagmanager.com https://*.posthog.com https://*.sentry.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.supabase.co https://*.storage.googleapis.com https://*.googleusercontent.com https://*.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.googleapis.com https://*.posthog.com https://*.sentry.io; frame-src 'self' https://*.google.com; manifest-src 'self'; media-src 'self' https://*.supabase.co; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

        # HTTP/3 Alt-Svc
        add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400' always;
        add_header x-quic 'h3' always;

        # ── Root & Index ─────────────────────────────────────
        root /var/www/playturf/dist;
        index index.html;

        # ── Gzip / Brotli precompressed files ────────────────
        gzip_static on;
        brotli_static on;

        # ── Static Assets (Aggressive Caching) ───────────────
        location ~* \.(js|mjs|jsx|ts|tsx|css|scss|sass|less)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
            access_log off;
        }

        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            access_log off;
        }

        location ~* \.(webp|png|jpg|jpeg|gif|svg|avif|ico|bmp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        location ~* \.(mp4|webm|ogg|mp3|wav|flac)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Accept-Ranges bytes always;
            access_log off;
        }

        location ~* \.(json|xml)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        }

        # ── Service Worker (No Cache) ────────────────────────
        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
        }

        # ── Manifest ─────────────────────────────────────────
        location = /manifest.webmanifest {
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            add_header Content-Type "application/manifest+json" always;
        }

        # ── HTML (No Cache) ──────────────────────────────────
        location = /index.html {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # ── SPA Fallback ─────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # ── API Proxy (if needed) ────────────────────────────
        location /api/ {
            proxy_pass http://playturf/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_cache_valid 200 5m;
            add_header Cache-Control "private, no-store" always;

            limit_req zone=api burst=20 nodelay;
        }
    }
}
